<style>
  .form-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    background-color: #f5f5f5;
  }

  iframe {
    width: 100%;
    height: 600px;
    border: 1px solid #ccc;
    margin-top: 10px;
  }
</style>

<!-- Search Form -->
<form class="form-row" action="{{ url_for('admin.search') }}" method="POST" target="resultsFrame">
  <select name="fromWhere">
    <option value="appointments">Appointments</option>
    <option value="doctors">Doctors</option>
    <option value="patients">Patients</option>
  </select>

  <select name="field">
    <option value="name">Name</option>
    <option value="date">Date</option>
    <option value="mobile">Mobile</option>
    <option value="email">Email</option>
    <option value="id">ID</option>
    <option value="address">Address</option>
    <option value="medicine">Medicine</option>
    <option value="tests">Tests</option>
    {% if current_user.role == "admin" %}
    <option value="Any">Any</option>
    {%endif %}
  </select>

  <input type="text" name="q" placeholder="Enter text here">

  <button type="submit">Search</button>
  <span id="rowCount" style="margin-left:10px; font-weight: bold;"> hi </span>
</form>

<!-- Results Frame -->
<iframe name="resultsFrame" id="resultsFrame"></iframe>

<script>
  document.addEventListener("DOMContentLoaded", function () {

    // Attach message listener first
    window.addEventListener("message", function (event) {
      console.log("Message received:", event.data);
      if (event.data && event.data.type === "visibleRowCount") {
        document.getElementById("rowCount").textContent = `(${event.data.count} shown)`;
        console.log("Received row count:", event.data.count);
      }
    });

    // Then handle iframe load resizing
    const iframe = document.querySelector('iframe[name="resultsFrame"]');
    iframe.addEventListener("load", function () {
      resizeIframe(this);
    });

    function resizeIframe(iframe) {
      if (!iframe.contentWindow?.document?.body) return;

      // get the document height inside the iframe
      const contentHeight = iframe.contentWindow.document.body.scrollHeight;

      // clamp between 300px minimum and 900px maximum (you can tune these)
      const minHeight = 300;
      const maxHeight = 600;

      const newHeight = Math.min(Math.max(contentHeight, minHeight), maxHeight);
      iframe.style.height = newHeight + 'px';

      console.log(`Iframe resized → ${newHeight}px (content: ${contentHeight}px)`);
    }

    const rowCountEl = document.getElementById("rowCount");
    document.querySelector("form").addEventListener("submit", () => {
      rowCountEl.textContent = "(Searching...)";
    });


  });
</script>
