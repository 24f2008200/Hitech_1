  <style>
    .form-row {
      display: flex;         
      align-items: center;   
      gap: 10px;             
      padding: 10px;
      background-color: #f5f5f5;
    }

    iframe {
      width: 100%;
      height: 600px;
      border: 1px solid #ccc;
      margin-top: 10px;
    }
  </style>

<!-- Search Form -->
<form class="form-row" action="{{ url_for('admin.search') }}" method="POST" target="resultsFrame">
  <select name="fromWhere">
    <option value="appointments">Appointments</option>
    <option value="doctors">Doctors</option>
    <option value="patients">Patients</option>
  </select>

  <select name="field">
    <option value="name">Name</option>
    <option value="date">Date</option>
    <option value="mobile">Mobile</option>
    <option value="email">Email</option>
    <option value="id">ID</option>
    <option value="address">Address</option>
    <option value="medicine">Medicine</option>
    <option value="tests">Tests</option>
  </select>

  <input type="text" name="q" placeholder="Enter text here">

  <button type="submit">Search</button>
</form>

<!-- Results Frame -->
<iframe name="resultsFrame"></iframe>

<script>
function resizeIframe(iframe) {
  iframe.style.height = iframe.contentWindow.document.body.scrollHeight + 'px';
}

document.getElementById('resultsFrame').addEventListener("load", function() {
  resizeIframe(this);
});
</script>
