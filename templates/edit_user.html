{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h2>Edit User: {{ user.username }}</h2>

  <form method="POST">
    {{ csrf_token() }}
    <!-- Core User Fields -->
    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input type="text" name="username" class="form-control" value="{{ user.username }}" required>
    </div>

    <div class="mb-3">
      <label for="role" class="form-label">Role</label>
      <select name="role" class="form-select">
        <option value="ADMIN" {% if user.role.name == "ADMIN" %}selected{% endif %}>Admin</option>
        <option value="DOCTOR" {% if user.role.name == "DOCTOR" %}selected{% endif %}>Doctor</option>
        <option value="PATIENT" {% if user.role.name == "PATIENT" %}selected{% endif %}>Patient</option>
      </select>
    </div>

    <!-- Doctor fields -->
    {% if doctor %}
      <h4>Doctor Details</h4>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">First Name</label>
          <input type="text" name="first_name" class="form-control" value="{{ doctor.first_name }}">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Last Name</label>
          <input type="text" name="last_name" class="form-control" value="{{ doctor.last_name }}">
        </div>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" value="{{ doctor.email }}">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Phone</label>
          <input type="text" name="phone" class="form-control" value="{{ doctor.phone }}">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">License Number</label>
        <input type="text" name="license_number" class="form-control" value="{{ doctor.license_number }}">
      </div>
      <div class="mb-3">
        <label class="form-label">Specialization ID</label>
        <input type="number" name="specialization_id" class="form-control" value="{{ doctor.specialization_id }}">
      </div>
    {% endif %}

    <!-- Patient fields -->
    {% if patient %}
      <h4>Patient Details</h4>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">First Name</label>
          <input type="text" name="first_name" class="form-control" value="{{ patient.first_name }}">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Last Name</label>
          <input type="text" name="last_name" class="form-control" value="{{ patient.last_name }}">
        </div>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" value="{{ patient.email }}">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Phone</label>
          <input type="text" name="phone" class="form-control" value="{{ patient.phone }}">
        </div>
      </div>
    {% endif %}

    <!-- Password Reset -->
    <div class="mb-3">
      <label for="password" class="form-label">Reset Password</label>
      <input type="password" name="password" class="form-control" placeholder="Leave blank to keep current password">
    </div>

    <button type="submit" class="btn btn-success">💾 Save Changes</button>
    <a href="{{ url_for('admin.admin_dashboard') }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
