{% extends "index.html" %}

{% block styles %}
  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-color: #f4f6f9;
    }
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }
    .form-card {
      background: #fff;
      padding: 2rem 2.5rem;
      border-radius: 12px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);
      max-width: 600px;
      width: 100%;
    }
    .form-title {
      text-align: center;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: #333;
    }

  </style>

  {% endblock %}


{% block content %}

  <main>
    <div class="form-card">
      <h3 class="form-title">User Registration</h3>

      <!-- Use bootstrap validation classes -->
      <form id="userForm" class="needs-validation" method="POST" novalidate>
        <div class="mb-3 row">
          <label class="col-sm-4 col-form-label">First Name</label>
          <div class="col-sm-8">
            <input type="text" name="name" class="form-control" required>
            <div class="invalid-feedback">First name is required.</div>
          </div>
        </div>

        <div class="mb-3 row">
          <label class="col-sm-4 col-form-label">Last Name</label>
          <div class="col-sm-8">
            <input type="text" name="last_name" class="form-control">
          </div>
        </div>

        <div class="mb-3 row">
          <label class="col-sm-4 col-form-label">Date of Birth</label>
          <div class="col-sm-8">
            <input type="date" name="dob" class="form-control">
          </div>
        </div>

        <div class="mb-3 row">
          <label class="col-sm-4 col-form-label">Email</label>
          <div class="col-sm-8">
            <input type="email" name="email" class="form-control" required>
            <div class="invalid-feedback">A valid email is required.</div>
          </div>
        </div>

        <div class="mb-3 row">
          <label class="col-sm-4 col-form-label">Phone</label>
          <div class="col-sm-8">
            <input type="tel" name="phone" class="form-control">
          </div>
        </div>

        <div class="mb-3 row">
          <label class="col-sm-4 col-form-label">Address</label>
          <div class="col-sm-8">
            <textarea name="address" class="form-control" rows="3"></textarea>
          </div>
        </div>

        <!-- PASSWORD -->
        <div class="mb-3 row">
          <label class="col-sm-4 col-form-label">Password</label>
          <div class="col-sm-8">
            <div class="input-group">
              <input type="password" name="password" class="form-control" minlength="8" autocomplete="new-password" required>
              <button class="btn btn-outline-secondary toggle-password" type="button" aria-label="Show password">Show</button>
            </div>
            <div class="small text-muted small-help">Minimum 8 characters.</div>
            <div class="invalid-feedback">Please provide a password (min 8 chars).</div>
          </div>
        </div>

        <!-- CONFIRM PASSWORD -->
        <div class="mb-3 row">
          <label class="col-sm-4 col-form-label">Confirm Password</label>
          <div class="col-sm-8">
            <div class="input-group">
              <input type="password" name="confirm_password" class="form-control" autocomplete="new-password" required>
              <button class="btn btn-outline-secondary toggle-password" type="button" aria-label="Show confirm password">Show</button>
            </div>
            <div id="confirmHelp" class="small mt-1"></div>
            <div class="invalid-feedback">Please confirm your password.</div>
          </div>
        </div>

        <div class="mb-3 row">
          <label class="col-sm-4 col-form-label">Role</label>
          <div class="col-sm-8">
            <select name="role" class="form-select">
              <option value="">Select Role</option>
              <option value="admin">Admin</option>
              <option value="staff">Staff</option>
              <option value="user">User</option>
            </select>
          </div>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary">Submit</button>
        </div>
      </form>
    </div>
  </main>

{% endblock %}
{% block scripts %}
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const form = document.getElementById('userForm');
      const pwd = form.querySelector('input[name="password"]');
      const confirmPwd = form.querySelector('input[name="confirm_password"]');
      const toggles = Array.from(document.querySelectorAll('.toggle-password'));
      const confirmHelp = document.getElementById('confirmHelp');

      // Show / Hide toggle for password fields (button text toggles Show/Hide)
      toggles.forEach(btn => {
        btn.addEventListener('click', function () {
          const input = this.closest('.input-group').querySelector('input');
          if (input.type === 'password') {
            input.type = 'text';
            this.textContent = 'Hide';
          } else {
            input.type = 'password';
            this.textContent = 'Show';
          }
        });
      });

      // Live match check
      function checkMatch() {
        if (!confirmPwd.value) {
          confirmPwd.classList.remove('is-valid', 'is-invalid');
          confirmHelp.textContent = '';
          return;
        }
        if (pwd.value === confirmPwd.value) {
          confirmPwd.classList.add('is-valid');
          confirmPwd.classList.remove('is-invalid');
          confirmHelp.textContent = 'Passwords match';
          confirmHelp.classList.remove('text-danger');
          confirmHelp.classList.add('text-success');
        } else {
          confirmPwd.classList.add('is-invalid');
          confirmPwd.classList.remove('is-valid');
          confirmHelp.textContent = 'Passwords do not match';
          confirmHelp.classList.add('text-danger');
          confirmHelp.classList.remove('text-success');
        }
      }
      pwd.addEventListener('input', checkMatch);
      confirmPwd.addEventListener('input', checkMatch);

      // Bootstrap validation + password match check on submit
      form.addEventListener('submit', function (e) {
        if (!form.checkValidity() || pwd.value !== confirmPwd.value) {
          e.preventDefault();
          e.stopPropagation();
          if (pwd.value !== confirmPwd.value) {
            confirmPwd.classList.add('is-invalid');
            confirmHelp.textContent = 'Passwords do not match';
            confirmHelp.classList.add('text-danger');
          }
          form.classList.add('was-validated');
        }
      }, false);
    });
  </script>


{% endblock %}
