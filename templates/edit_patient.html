{% extends "base.html" %}
{% block content %}
<div class="card">
  <div class="card-header">
    Edit Patient — ID {{ patient.id }}
  </div>
  <div class="card-body">
    <form method="post">
        <div class="row mb-3">
        <div class="col">
          <label class="form-label">First name</label>
          <input type="text" name="first_name" class="form-control" value="{{ patient.first_name }}" required>
        </div>
        <div class="col">
          <label class="form-label">Last name</label>
          <input type="text" name="last_name" class="form-control" value="{{ patient.last_name }}">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" value="{{ patient.email }}">
      </div>

      <div class="mb-3">
        <label class="form-label">Phone</label>
        <input type="text" name="phone" class="form-control" value="{{ patient.phone }}">
      </div>

      <!-- 🔒 Reset Password -->
      <div class="mb-3">
        <label class="form-label">Reset Password</label>
        <input type="password" name="password" class="form-control" placeholder="Leave blank to keep current password">
      </div>

      <button class="btn btn-success">Save changes</button>
      <a class="btn btn-secondary ms-2" href="{{ url_for('admin.admin_dashboard', tab_id=2) }}">Cancel</a>
    </form>

    <!-- 🚫 Blacklist Patient -->
    <form method="post" action="{{ url_for('blacklist_user', user_id=user.id) }}" class="mt-3">
      {{ csrf_token() }}
      <button type="submit" class="btn btn-danger">🚫 Blacklist Patient</button>
    </form>
  </div>
</div>
{% endblock %}
