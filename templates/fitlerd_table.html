<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Filterable Table</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    .filters {
      margin-top: 4px;
    }
  </style>
</head>

<body class="p-3">

  <div id="table-container"></div>

  <script>
    // Test data
    const columns = [
      { key: "id", label: "ID" },
      { key: "name", label: "Name" },
      { key: "status", label: "Status", filterType: "select" },
      { key: "action", label: "Edit", type: "action" }
    ];

    const rows = [
      { id: 1, name: "Alice", status: "Active" },
      { id: 2, name: "Bob", status: "Inactive" },
      { id: 3, name: "Charlie", status: "Active" },
      { id: 4, name: "Diana", status: "Pending" }
    ];

    const enableFilters = true;
    const filters = {}; // keep track of current filters

    // Build table
    function buildTable() {
      const container = document.getElementById("table-container");
      container.innerHTML = "";

      const table = document.createElement("table");
      table.className = "table table-striped align-middle text-center";

      const thead = document.createElement("thead");
      const trHead = document.createElement("tr");

      columns.forEach(col => {
        const th = document.createElement("th");
        th.className = "px-2 py-2";
        th.textContent = col.label;

        if (enableFilters) {
          const filterDiv = document.createElement("div");
          filterDiv.className = "filters";

          if (col.filterType === "select") {
            const select = document.createElement("select");
            select.className = "form-select form-select-sm w-auto d-inline-block";
            select.innerHTML = `<option value="">All</option>`;
            uniqueValues(col.key).forEach(v => {
              const option = document.createElement("option");
              option.value = v;
              option.textContent = v;
              select.appendChild(option);
            });
            select.addEventListener("change", e => {
              filters[col.key] = e.target.value;
              renderBody(table);
            });
            filterDiv.appendChild(select);
          } else {
            const input = document.createElement("input");
            input.type = "text";
            input.className = "form-control form-control-sm w-auto d-inline-block";
            input.placeholder = `Filter by ${col.label}`;
            input.addEventListener("input", e => {
              filters[col.key] = e.target.value;
              renderBody(table);
            });
            filterDiv.appendChild(input);
          }

          th.appendChild(filterDiv);
        }

        trHead.appendChild(th);
      });

      thead.appendChild(trHead);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");
      table.appendChild(tbody);

      container.appendChild(table);

          console.log("Sending count:", "table loaded");
    window.parent.postMessage(
      { type: "visibleRowCount", count: rows.length },
      "*"
    );

      renderBody(table);
    }

    // Render body with filtered rows
    function renderBody(table) {
      const tbody = table.querySelector("tbody");
      tbody.innerHTML = "";

      getFilteredRows().forEach(row => {
        const tr = document.createElement("tr");

        columns.forEach(col => {
          const td = document.createElement("td");
          td.className = "px-2 py-1";

          if (col.type === "action") {
            const btn = document.createElement("button");
            btn.className = "btn btn-sm btn-primary me-1";
            btn.textContent = col.label;
            btn.addEventListener("click", () => {
              alert(`Action "${col.key}" clicked for row ID: ${row.id}`);
            });
            td.appendChild(btn);
          } else {
            td.textContent = row[col.key];
          }

          tr.appendChild(td);
        });

        tbody.appendChild(tr);
      });
    }
    console.log("Sending count:", filtered.length);
    window.parent.postMessage(
      { type: "visibleRowCount", count: filtered.length },
      "*"
    );
    // Filter logic
    function getFilteredRows() {
      return rows.filter(row =>
        Object.keys(filters).every(key => {
          const filter = String(filters[key] || "").toLowerCase();
          if (!filter) return true;

          const col = columns.find(c => c.key === key);
          const value = String(row[key] || "").toLowerCase();

          if (col?.filterType === "select") {
            return value === filter;
          } else {
            return value.includes(filter);
          }
        })
      );
    }

    // Helper: unique values for dropdowns
    function uniqueValues(key) {
      return [...new Set(rows.map(r => r[key]).filter(v => v != null && v !== ""))];
    }

    // Init
    buildTable();
  </script>
</body>

</html>
